services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: doctor_recommendation
      MYSQL_USER: doctor
      MYSQL_PASSWORD: doctor
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctor_recommendation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: doctor
      SPRING_DATASOURCE_PASSWORD: doctor
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RECOMMENDATION_CACHE_TTL_MINUTES: ${RECOMMENDATION_CACHE_TTL_MINUTES:-30}
      PROVIDER_LOOKUP_CACHE_TTL_MINUTES: ${PROVIDER_LOOKUP_CACHE_TTL_MINUTES:-1440}
      LOCATION_SEARCH_CACHE_TTL_MINUTES: ${LOCATION_SEARCH_CACHE_TTL_MINUTES:-1440}
      SECURITY_ENABLED: ${SECURITY_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
