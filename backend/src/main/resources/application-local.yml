spring:
  datasource:
    url: jdbc:h2:mem:doctor_recommendation;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379

app:
  security:
    enabled: false
  openai:
    api-key: ${OPENAI_API_KEY:}
  google:
    places-api-key: ${GOOGLE_PLACES_API_KEY:}
  serpapi:
    api-key: ${SERPAPI_API_KEY:}
  cache:
    recommendation-ttl-minutes: ${RECOMMENDATION_CACHE_TTL_MINUTES:30}
    provider-lookup-ttl-minutes: ${PROVIDER_LOOKUP_CACHE_TTL_MINUTES:1440}
    location-search-ttl-minutes: ${LOCATION_SEARCH_CACHE_TTL_MINUTES:1440}
