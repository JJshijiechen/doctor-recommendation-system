apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: doctor-recommendation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/doctor-recommendation-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: <ELASTICACHE_ENDPOINT>
            - name: REDIS_PORT
              value: "6379"
            - name: LOCATION_SEARCH_CACHE_TTL_MINUTES
              value: "1440"
            - name: SECURITY_ENABLED
              value: "true"
            - name: CORS_ALLOWED_ORIGINS
              value: https://<APP_DOMAIN>
          envFrom:
            - secretRef:
                name: doctor-recommendation-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: doctor-recommendation
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
