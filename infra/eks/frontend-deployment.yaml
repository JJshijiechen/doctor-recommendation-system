apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: doctor-recommendation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/doctor-recommendation-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: doctor-recommendation
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
